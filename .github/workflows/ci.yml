name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # No dependencies to install — the client bundle is hand-written and the
      # smoke tests run in a plain Node VM. Just run them.
      - name: Run tests
        run: npm test
      - name: Syntax check the host + client bundles
        run: node --check lib/index.js && node --check lib/client.js

  # The shipped package stays dependency-free; we pull TypeScript on demand
  # here so the advisory `.d.ts` declarations are actually compiled (they are
  # otherwise never checked, and drift silently). A local ambient stub covers
  # the private @deepseek-ai/cordis module so the check is self-contained.
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Typecheck the .d.ts declarations
        run: npx -y -p typescript@5.6 tsc -p tsconfig.json
